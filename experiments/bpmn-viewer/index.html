<script src="vendor/bpmn-navigated-viewer.production.min.js"></script>
<script>
(function () {
  var status = document.getElementById("status");
  var say = function (text) { if (status) status.textContent = text; };

  /**
   * Fit the diagram to whatever box the host gives us.
   *
   * `canvas.zoom("fit-viewport")` is not usable here: the document preview mounts the
   * iframe before the panel is laid out (the frame reports innerWidth 0 while hidden),
   * and a fit attempted in that state silently leaves the diagram at scale 1 — it
   * overflows a narrow panel and sits in the corner of a wide one, with no error.
   *
   * So size it declaratively instead: pin a viewBox to the rendered content's bbox and
   * let CSS scale the SVG. Width/height 100% + viewBox means the browser re-fits on
   * every container resize on its own — no ResizeObserver, no retry loop, and it works
   * whether the panel is hidden, narrow, or fullscreen. diagram-js pan/zoom still work,
   * applied on top of this base scale.
   */
  function fitToContainer(viewer) {
    var canvas = viewer.get("canvas");
    var el = canvas.getContainer();
    var svg = el.querySelector("svg");
    if (!svg) { return false; }
    // bbox of everything drawn, in the SVG's own user units
    var content = svg.querySelector("g.viewport > g") || svg;
    var box;
    try { box = content.getBBox(); } catch (e) { return false; }
    if (!box || !isFinite(box.width) || !isFinite(box.height) || box.width <= 0 || box.height <= 0) { return false; }

    var pad = 10; // a little breathing room so edge labels are not clipped
    svg.setAttribute("viewBox", [box.x - pad, box.y - pad, box.width + pad * 2, box.height + pad * 2].join(" "));
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.style.width = "100%";
    svg.style.height = "100%";
    return true;
  }

  /**
   * The preview mounts the iframe before the panel is laid out — in a hidden tab the
   * container is 0x0 and the SVG has no measurable content. So: fit whenever the
   * container has a real box, and re-publish the check each time, so the reported
   * result is honest both while hidden ("not fitted yet") and once shown.
   *
   * The observer stays connected: the viewBox makes resizes automatic, but re-fitting
   * is what keeps the published check truthful after the panel becomes visible.
   */
  function keepFitted(viewer) {
    var el = viewer.get("canvas").getContainer();

    var sync = function () {
      if (el.clientWidth > 0 && el.clientHeight > 0) { fitToContainer(viewer); }
      publish(selfCheck(viewer));
    };

    if (typeof ResizeObserver === "function") {
      new ResizeObserver(sync).observe(el);
    }
    var tries = 120;
    (function tick() {
      sync();
      if (tries-- <= 0) { return; }
      requestAnimationFrame(tick);
    })();
  }

  function publish(result) {
    window.__fit = result;
    var out = document.getElementById("fit");
    if (out) { out.textContent = JSON.stringify(result); }
  }

  /**
   * Self-check, published on `window.__fit` **and** in the DOM (`<pre id="fit">`).
   *
   * It has to live inside this document: the host renders it in a sandboxed iframe, so a
   * parent page cannot read this DOM (`SecurityError: Blocked a frame with origin "null"`).
   * The DOM copy is the one a checker should trust — reading a page global from a
   * sandboxed frame is not reliable across automation worlds, while reading an element is.
   */
  function selfCheck(viewer) {
    var canvas = viewer.get("canvas");
    var el = canvas.getContainer();
    var svg = el.querySelector("svg");
    if (!svg) { return { pass: false, reason: "no svg" }; }
    var els = [].slice.call(svg.querySelectorAll(".djs-element"));
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, painted = 0;
    els.forEach(function (e) {
      var b = e.getBoundingClientRect();
      if (!b.width && !b.height) { return; }
      painted++;
      minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
      maxX = Math.max(maxX, b.x + b.width); maxY = Math.max(maxY, b.y + b.height);
    });
    var cw = el.clientWidth, ch = el.clientHeight;
    var inside = painted > 0 && minX >= -1 && minY >= -1 && maxX <= cw + 1 && maxY <= ch + 1;
    // a diagram left at scale 1 huddles in one corner: require it to actually use the box
    var fillsW = (maxX - minX) >= cw * 0.5 || (maxY - minY) >= ch * 0.5;
    return {
      pass: inside && fillsW,
      elements: els.length, painted: painted,
      viewBox: svg.getAttribute("viewBox"),
      container: { w: cw, h: ch },
      paintedBox: { x: Math.round(minX), y: Math.round(minY), w: Math.round(maxX - minX), h: Math.round(maxY - minY) },
      inside: inside, fills: fillsW,
      status: status ? status.textContent : null,
    };
  }

  try {
    if (typeof BpmnJS !== "function") { say("ERROR: BpmnJS global missing"); return; }
    var xml = document.getElementById("bpmnxml").textContent;
    var viewer = new BpmnJS({ container: "#canvas" });
    window.__viewer = viewer;
    viewer.importXML(xml)
      .then(function () {
        say("BPMN 2.0 \u00b7 " + document.querySelectorAll("#canvas svg .djs-element").length + " elements");
        keepFitted(viewer);
      })
      .catch(function (e) { say("ERROR: " + (e && e.message || e)); });
  } catch (e) {
    say("THROWN: " + (e && e.message || e));
    window.__fit = { pass: false, reason: String(e && e.message || e) };
  }
})();
</script>
